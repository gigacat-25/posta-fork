services:
  posta:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${POSTA_PORT:-9000}:9000"
    environment:
      POSTA_DB_URL: "host=posta-db user=${POSTA_DB_USER:-posta} password=${POSTA_DB_PASSWORD:-posta} dbname=${POSTA_DB_NAME:-posta} port=5432 sslmode=disable"
      POSTA_REDIS_ADDR: "posta-redis:6379"
      POSTA_ENV: "${POSTA_ENV:-production}"
      POSTA_JWT_SECRET: "${POSTA_JWT_SECRET:?POSTA_JWT_SECRET is required}"
      POSTA_ADMIN_EMAIL: "${POSTA_ADMIN_EMAIL:?POSTA_ADMIN_EMAIL is required}"
      POSTA_ADMIN_PASSWORD: "${POSTA_ADMIN_PASSWORD:?POSTA_ADMIN_PASSWORD is required}"
      # System SMTP Configuration (auto-provisions and links Postfix SMTP on startup)
      POSTA_SYSTEM_SMTP_HOST: "smtp"
      POSTA_SYSTEM_SMTP_PORT: 587
      POSTA_SYSTEM_SMTP_USERNAME: "${POSTFIX_SMTP_USER:-posta}"
      POSTA_SYSTEM_SMTP_PASSWORD: "${POSTFIX_SMTP_PASSWORD:-PostaSmtpPass2026!}"
      POSTA_SYSTEM_SMTP_FROM: "${POSTA_DEFAULT_FROM:-notifications@${MAIL_DOMAIN:-localhost}}"
      POSTA_SYSTEM_SMTP_ENCRYPTION: "starttls"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      posta-db:
        condition: service_healthy
      posta-redis:
        condition: service_healthy
      smtp:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["worker"]
    environment:
      POSTA_DB_URL: "host=posta-db user=${POSTA_DB_USER:-posta} password=${POSTA_DB_PASSWORD:-posta} dbname=${POSTA_DB_NAME:-posta} port=5432 sslmode=disable"
      POSTA_REDIS_ADDR: "posta-redis:6379"
      POSTA_ENV: "${POSTA_ENV:-production}"
      POSTA_JWT_SECRET: "${POSTA_JWT_SECRET:?POSTA_JWT_SECRET is required}"
      POSTA_WORKER_CONCURRENCY: "${POSTA_WORKER_CONCURRENCY:-10}"
      POSTA_WORKER_MAX_RETRIES: "${POSTA_WORKER_MAX_RETRIES:-5}"
      # System SMTP Configuration
      POSTA_SYSTEM_SMTP_HOST: "smtp"
      POSTA_SYSTEM_SMTP_PORT: 587
      POSTA_SYSTEM_SMTP_USERNAME: "${POSTFIX_SMTP_USER:-posta}"
      POSTA_SYSTEM_SMTP_PASSWORD: "${POSTFIX_SMTP_PASSWORD:-PostaSmtpPass2026!}"
      POSTA_SYSTEM_SMTP_FROM: "${POSTA_DEFAULT_FROM:-notifications@${MAIL_DOMAIN:-localhost}}"
      POSTA_SYSTEM_SMTP_ENCRYPTION: "starttls"
    depends_on:
      posta-db:
        condition: service_healthy
      posta-redis:
        condition: service_healthy
      smtp:
        condition: service_started
    restart: unless-stopped

  smtp:
    image: boky/postfix
    container_name: posta-smtp
    environment:
      POSTFIX_myhostname: "${MAIL_HOSTNAME:-mail.${MAIL_DOMAIN:-localhost}}"
      POSTFIX_mydomain: "${MAIL_DOMAIN:-localhost}"
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      ALLOWED_SENDER_DOMAINS: "${ALLOWED_SENDER_DOMAINS:-${MAIL_DOMAIN:-localhost}}"
      POSTFIX_always_add_missing_headers: "yes"
      SMTPD_SASL_USERS: "${POSTFIX_SMTP_USER:-posta}:${POSTFIX_SMTP_PASSWORD:-PostaSmtpPass2026!},${POSTFIX_SMTP_USER:-posta}@${MAIL_DOMAIN:-localhost}:${POSTFIX_SMTP_PASSWORD:-PostaSmtpPass2026!}"
      ALLOWED_NETWORKS: "172.16.0.0/12,10.0.0.0/8,127.0.0.0/8,192.168.0.0/16"
    ports:
      - "587:587"
      - "25:25"
    volumes:
      - smtp_data:/var/spool/postfix
    restart: unless-stopped

  posta-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTA_DB_USER:-posta}"
      POSTGRES_PASSWORD: "${POSTA_DB_PASSWORD:-posta}"
      POSTGRES_DB: "${POSTA_DB_NAME:-posta}"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTA_DB_USER:-posta}"]
      interval: 5s
      timeout: 5s
      retries: 5

  posta-redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  redis_data:
  smtp_data:
